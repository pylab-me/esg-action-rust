name: CI

# Example: an existing two-workspace CI workflow (gateway + bench)
# migrated to cargo-cache-action. The generate-manifests and
# actions/cache steps collapse into one restore at the top and one
# save at the bottom. Saves run only on main: pull requests restore
# the main cache but never write one.

on:
  push:
    paths:
      - "bench/**"
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: nightly-2026-10-01
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: edge-gateway (+ optional bench) tests
    runs-on: ubuntu-latest
    container:
      image: rust:slim
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pinned nightly
        id: setup_rust
        uses: pylab-me/esg-action-rust/setup@v0.2.0
        with:
          toolchain: ${{ steps.setup_rust.outputs.toolchain }}

      - name: Restore Cargo caches
        id: cargo_cache
        uses: pylab-me/esg-action-rust@v0.2.0
        with:
          key-prefix: edge-gateway-ci
          profile-name: ci
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          manifests: |
            Cargo.toml
            bench/Cargo.toml
            bench/*/Cargo.toml
          lockfiles: |
            Cargo.lock
            bench/Cargo.lock

      - name: Test gateway
        run: cargo +"${RUST_TOOLCHAIN}" test --workspace

      - name: Test bench
        if: ${{ hashFiles('bench/Cargo.toml') != '' }}
        working-directory: bench
        run: cargo +"${RUST_TOOLCHAIN}" test --workspace

      - name: Save Cargo caches
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: pylab-me/esg-action-rust/save@v0.2.0
        with:
          registry-key: ${{ steps.cargo_cache.outputs.registry-key }}
          target-key: ${{ steps.cargo_cache.outputs.target-key }}
          registry-paths: ${{ steps.cargo_cache.outputs.registry-paths }}
          manifests: Cargo.toml
